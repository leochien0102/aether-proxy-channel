name: publish-component
run-name: publish ${{ inputs.tag }}

# Publish a component that was built and released by the application repository.
# No SDK, no compiler, no build: the channel only pulls release assets, verifies them,
# merges them into the signed manifest and publishes for the online update page.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: '代码仓库的组件 release tag（例如 xray-v26.11.9-r1）'
        required: true
        type: string
      component:
        description: '组件包名（例如 aether-xray）'
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    concurrency:
      group: channel-publish
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      APP_REPO: leochien0102/aether-proxy
      TAG: ${{ inputs.tag }}
      COMPONENT: ${{ inputs.component }}
      USIGN_SECRET_KEY: ${{ secrets.USIGN_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate the input
        run: |
          set -euo pipefail
          echo "$TAG" | grep -qxE '(xray|dns|chinadns-ng)-v[0-9][0-9A-Za-z.+~-]*-r[0-9]+' || { echo '::error::invalid component tag'; exit 1; }
          echo "$COMPONENT" | grep -qxE '[a-z0-9-]+' || { echo '::error::invalid component'; exit 1; }

      - name: Download and verify the component release
        run: |
          set -euo pipefail
          mkdir -p assets
          gh release download "$TAG" --repo "$APP_REPO" --dir assets --pattern '*.ipk' --pattern '*.apk' --pattern 'SHA256SUMS'
          ( cd assets && sha256sum -c SHA256SUMS )
          ls -l assets

      - name: Arrange assets in the feed layout
        run: |
          set -euo pipefail
          rm -rf packages
          shopt -s nullglob
          for file in assets/*.ipk assets/*.apk; do
            base=${file##*/}
            case "$base" in
              *_aarch64_generic.*|*-aarch64_generic.*) arch=aarch64_generic ;;
              *_x86_64.*|*-x86_64.*) arch=x86_64 ;;
              *) echo "::error::cannot derive the package arch from $base"; exit 1 ;;
            esac
            mkdir -p "packages/$arch/channel"
            cp "$file" "packages/$arch/channel/"
          done
          find packages -type f | sort

      - uses: actions/checkout@v4
        with:
          repository: leochien0102/aether-proxy
          ref: ${{ inputs.tag }}
          path: src/aether-proxy

      - name: Build usign
        run: scripts/usign.sh "$RUNNER_TEMP/usign"

      - name: Sign and publish, keeping the components this release does not carry
        env:
          USIGN: ${{ runner.temp }}/usign
          KEEP_MISSING: '1'
        run: scripts/publish.sh src/aether-proxy packages
