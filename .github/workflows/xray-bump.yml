name: xray-bump

# Open a pull request when upstream Xray has a newer release (prereleases included, 08
# "发布通道"). The PR only edits aether-xray/Makefile; the packages workflow gates it against
# aether-proxy's golden configs, and nothing ships until the owner merges it.

on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Look for a newer Xray release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          current=$(sed -n 's/^PKG_VERSION:=//p' aether-xray/Makefile)
          latest=$(gh api 'repos/XTLS/Xray-core/releases?per_page=30' \
            -q '.[] | select(.draft | not) | .tag_name' | sed -n 's/^v\([0-9][0-9.]*\)$/\1/p' | sort -V | tail -1)
          echo "current $current, latest $latest"
          if [ -z "$latest" ] || [ "$(printf '%s\n' "$current" "$latest" | sort -V | tail -1)" = "$current" ]; then
            exit 0
          fi
          # Keep legacy bump/xray-* branches separate; only the owner cleans them up.
          branch="bump/aether-xray-$latest"
          if git ls-remote --exit-code origin "refs/heads/$branch" >/dev/null; then
            echo "$branch already exists"
            exit 0
          fi
          echo "version=$latest" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Update aether-xray/Makefile
        if: steps.check.outputs.version != ''
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          set -eu
          hash=$(curl -fsSL "https://codeload.github.com/XTLS/Xray-core/tar.gz/v$VERSION" | sha256sum | cut -d' ' -f1)
          sed -i -e "s/^PKG_VERSION:=.*/PKG_VERSION:=$VERSION/" -e 's/^PKG_RELEASE:=.*/PKG_RELEASE:=1/' \
            -e "s/^PKG_HASH:=.*/PKG_HASH:=$hash/" aether-xray/Makefile

          # Raise the pinned Go toolchain only when the new go.mod needs a newer one.
          need=$(curl -fsSL "https://raw.githubusercontent.com/XTLS/Xray-core/v$VERSION/go.mod" | sed -n 's/^go //p')
          have=$(sed -n 's/^GO_TOOLCHAIN_VERSION:=//p' aether-xray/Makefile)
          if [ "$(printf '%s\n' "$need" "$have" | sort -V | head -1)" != "$need" ]; then
            read -r go go_hash < <(curl -fsSL 'https://go.dev/dl/?mode=json' | python3 -c '
          import json, sys
          for release in json.load(sys.stdin):
              for f in release["files"]:
                  if f["os"] == "linux" and f["arch"] == "amd64" and f["kind"] == "archive":
                      print(release["version"][2:], f["sha256"]); sys.exit()')
            [ "$(printf '%s\n' "$need" "$go" | sort -V | head -1)" = "$need" ] || { echo "::error::no stable Go satisfies go $need"; exit 1; }
            sed -i -e "s/^GO_TOOLCHAIN_VERSION:=.*/GO_TOOLCHAIN_VERSION:=$go/" \
              -e "s/^GO_TOOLCHAIN_HASH:=.*/GO_TOOLCHAIN_HASH:=$go_hash/" aether-xray/Makefile
          fi
          git diff

      - name: Open the pull request and run its checks
        if: steps.check.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.check.outputs.version }}
          BRANCH: ${{ steps.check.outputs.branch }}
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$BRANCH"
          git add aether-xray/Makefile
          git commit -m "aether-xray: update to $VERSION"
          git push -q origin "$BRANCH"
          gh pr create --head "$BRANCH" --title "aether-xray: update to $VERSION" --body \
            "Update aether-xray to the unpatched upstream release: https://github.com/XTLS/Xray-core/releases/tag/v$VERSION

          The \`packages\` workflow run on this branch is the gate (golden configs with upstream \`xray run -test\`, aether-xray SDK builds). Merge only when it passes; merging publishes to channel-stable."
          # Pull requests opened with GITHUB_TOKEN do not trigger workflows; dispatch the gate.
          gh workflow run packages.yml --ref "$BRANCH"
