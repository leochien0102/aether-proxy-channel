name: Promote RC

on:
  workflow_dispatch:
    inputs:
      rc_tag:
        description: 'Existing app prerelease tag (vVERSION[-rN]-rcN)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  promote:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      group: channel-publish
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      APP_REPO: leochien0102/aether-proxy
      RC_TAG: ${{ inputs.rc_tag }}
    steps:
      - uses: actions/checkout@v4 # channel only; never checkout app source
      - name: Download and validate immutable prerelease
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, re, shutil, subprocess
          from pathlib import Path
          repo, tag = os.environ['APP_REPO'], os.environ['RC_TAG']
          if not re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+(?:-r[0-9]+)?-rc[1-9][0-9]*', tag):
              raise SystemExit('Invalid RC tag')
          def api(endpoint):
              return json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/{endpoint}']))
          def resolve(tag):
              obj = api('git/ref/tags/' + tag)['object']
              for _ in range(10):
                  if obj['type'] == 'commit':
                      return obj['sha']
                  if obj['type'] != 'tag':
                      break
                  obj = api('git/tags/' + obj['sha'])['object']
              raise SystemExit('Tag does not resolve to commit')
          release = api('releases/tags/' + tag)
          if release['tag_name'] != tag or release['draft'] or not release['prerelease']:
              raise SystemExit('Only published prerelease assets are accepted')
          commit = resolve(tag)
          subprocess.run(['gh', 'release', 'download', tag, '--repo', repo, '--dir', 'download'], check=True)
          root = Path('download')
          manifest = json.loads((root / 'rc-manifest.json').read_text())
          if manifest['schema'] != 1 or manifest['rc_tag'] != tag or manifest['commit'] != commit:
              raise SystemExit('RC tag/commit binding mismatch')
          # Fetch only the two standalone publication tools and version metadata at the RC commit.
          # No app checkout, SDK, package build, or host compiler is involved.
          def fetch(path):
              data = subprocess.check_output(['gh', 'api', '-H', 'Accept: application/vnd.github.raw+json',
                                             f'repos/{repo}/contents/{path}?ref={commit}'])
              dest = Path('publisher') / path
              dest.parent.mkdir(parents=True, exist_ok=True); dest.write_bytes(data)
              return data.decode()
          def fields(name):
              text = fetch(name + '/Makefile')
              return tuple(re.search(r'^' + key + r':=(\S+)$', text, re.M)[1]
                           for key in ['PKG_VERSION', 'PKG_RELEASE'])
          names = ['aether-proxy', 'luci-app-aether-proxy', 'luci-i18n-aether-proxy-zh-cn', 'aether-xray', 'chinadns-ng']
          versions = {name: fields(name) for name in names if name != names[2]}
          version, revision = versions['aether-proxy']
          target = f'v{version}-r{revision}'
          if (manifest['version'] != version or manifest['target_tag'] != target
                  or not re.fullmatch(r'v' + re.escape(version) + r'(?:-r' + re.escape(revision) + r')?-rc[1-9][0-9]*', tag)):
              raise SystemExit('RC target version mismatch')
          # If the formal tag already exists, it must bind to this exact commit.
          refs = api('git/matching-refs/tags/' + target)
          if any(r['ref'] == 'refs/tags/' + target for r in refs) and resolve(target) != commit:
              raise SystemExit('Formal tag/RC commit mismatch')
          entries = manifest['assets']
          expected = {(n, a, f) for n in names for a in ['aarch64_generic', 'x86_64'] for f in ['ipk', 'apk']}
          if len(entries) != 20 or {(e['package'], e['arch'], e['format']) for e in entries} != expected:
              raise SystemExit('Incomplete/duplicate RC package matrix')
          if any(len({e['version'] for e in entries if e['package'] == n}) != 1 for n in names):
              raise SystemExit('Inconsistent package versions across matrix')
          files = {e['asset'] for e in entries} | {'rc-manifest.json', 'SHA256SUMS'}
          # An RC that carries the reviewed bridge chain has one extra asset, bound in rc-manifest.
          compat_name = manifest.get('compatibility')
          if compat_name is not None and (not isinstance(compat_name, str)
                  or not re.fullmatch(r'[A-Za-z0-9._-]+', compat_name)
                  or compat_name in {e['asset'] for e in entries}):
              raise SystemExit('Invalid compatibility asset binding')
          if compat_name is not None:
              files.add(compat_name)
          expected = 23 if compat_name is not None else 22
          if (len(files) != expected
                  or {p.name for p in root.iterdir()} != files
                  or {a['name'] for a in release['assets']} != files):
              raise SystemExit('Prerelease asset set mismatch')
          sums = {}
          for line in (root / 'SHA256SUMS').read_text().splitlines():
              match = re.fullmatch(r'([0-9a-f]{64})  ([A-Za-z0-9._-]+)', line)
              if not match or match[2] in sums:
                  raise SystemExit('Invalid checksum list')
              sums[match[2]] = match[1]
          if set(sums) != files - {'SHA256SUMS'}:
              raise SystemExit('Incomplete checksum list')
          for filename, digest in sums.items():
              if hashlib.sha256((root / filename).read_bytes()).hexdigest() != digest:
                  raise SystemExit('RC hash mismatch: ' + filename)
          for e in entries:
              n, a, f, filename, v = (e[k] for k in ['package', 'arch', 'format', 'filename', 'version'])
              if not re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9.+~_-]*\.' + f, filename) or '..' in filename:
                  raise SystemExit('Unsafe package filename')
              pkg_arch = 'all' if n in names[:3] else a
              want_name = f'{n}_{v}_{pkg_arch}.ipk' if f == 'ipk' else f'{n}-{v}.apk'
              if filename != want_name or e['asset'] != a + '--' + re.sub(r'[^A-Za-z0-9._-]', '.', filename):
                  raise SystemExit('Package name/architecture mismatch')
              if n != names[2]:
                  base, rev = versions[n]
                  if v != base + '-r' + rev:
                      raise SystemExit('Package version mismatch')
              elif not re.fullmatch(r'[0-9][A-Za-z0-9.+~_-]*', v):
                  raise SystemExit('Invalid translation version')
              data = (root / e['asset']).read_bytes()
              if hashlib.sha256(data).hexdigest() != e['sha256']:
                  raise SystemExit('Manifest hash mismatch')
              dest = Path('packages') / a / 'rc' / filename
              dest.parent.mkdir(parents=True, exist_ok=True); dest.write_bytes(data)
          fetch('tools/channel/build.py')
          fetch('tools/data/build.py')
          # The reviewed bridge chain rides the prerelease (rc-manifest binds the asset). Every
          # step asset must be the signed aether-proxy bytes: the built target comes from the RC,
          # historical steps come from the existing stable channel. Anything missing or tampered
          # fails here, before preflight, signing or any release operation. No app checkout, no
          # SDK, no compilation: only already-built bytes are moved and verified.
          if compat_name is not None:
              try:
                  value = json.loads((root / compat_name).read_text())
              except json.JSONDecodeError as exc:
                  raise SystemExit(f'compatibility asset is not valid JSON: {exc}')
              chain = value.get('aether-proxy') if isinstance(value, dict) else None
              steps = chain.get('steps') if isinstance(chain, dict) else None
              if not isinstance(steps, list) or not steps:
                  raise SystemExit('Compatibility asset has no bridge steps')
              bridge = Path('bridge'); bridge.mkdir()
              shutil.copyfile(root / compat_name, bridge / 'compatibility.json')
              for step in steps:
                  version = step.get('version') if isinstance(step, dict) else None
                  assets = step.get('assets') if isinstance(step, dict) else None
                  formats = assets.get('all') if isinstance(assets, dict) else None
                  if not isinstance(formats, dict) or set(formats) != {'ipk', 'apk'}:
                      raise SystemExit(f'Bridge step {version}: aether-proxy is noarch and needs ipk and apk assets')
                  for kind, asset in formats.items():
                      url = asset.get('url') if isinstance(asset, dict) else None
                      if (not isinstance(url, str) or not re.fullmatch(r'[A-Za-z0-9_][A-Za-z0-9_.-]*\.' + kind, url)
                              or not isinstance(asset.get('sha256'), str)
                              or not re.fullmatch(r'[0-9a-f]{64}', asset['sha256'])
                              or type(asset.get('size')) is not int or asset['size'] <= 0):
                          raise SystemExit(f'Bridge step {version}: invalid {kind} asset metadata')
                      dest = bridge / url
                      source = next((e for e in entries if e['package'] == 'aether-proxy' and e['format'] == kind
                                     and e['arch'] == 'aarch64_generic'
                                     and re.sub(r'[^A-Za-z0-9._-]', '.', e['filename']) == url), None)
                      if source is not None:
                          shutil.copyfile(root / source['asset'], dest)
                      elif not dest.is_file():
                          downloaded = subprocess.run(['gh', 'release', 'download', 'channel-stable',
                                                       '-p', url, '-D', str(bridge)], capture_output=True)
                          if downloaded.returncode != 0 or not dest.is_file():
                              raise SystemExit(f'Bridge asset {url} is neither in the RC prerelease '
                                               f'nor in the stable channel: {downloaded.stderr.decode(errors="replace").strip()}')
                      data = dest.read_bytes()
                      if len(data) != asset['size'] or hashlib.sha256(data).hexdigest() != asset['sha256']:
                          raise SystemExit(f'Bridge asset hash/size mismatch: {url}')
              with open(os.environ['GITHUB_ENV'], 'a') as env:
                  env.write(f'COMPATIBILITY_FILE={bridge.resolve() / "compatibility.json"}\n')
          PY
      - name: Reject existing assets with different bytes
        shell: bash
        run: |
          set -euo pipefail
          # Same compatibility input as the final publish; bridge bytes sit beside the file.
          args=(--packages packages)
          [ -z "${COMPATIBILITY_FILE:-}" ] || args+=(--compatibility "$COMPATIBILITY_FILE")
          python3 publisher/tools/channel/build.py "${args[@]}" --out preflight
          # API errors fail closed, rather than being mistaken for an empty stable release.
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > channel-releases.json
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          releases = [r for page in json.load(open('channel-releases.json')) for r in page]
          stable = [r for r in releases if r['tag_name'] == 'channel-stable']
          if stable:
              subprocess.run(['gh', 'release', 'download', 'channel-stable', '--dir', 'existing'], check=True)
              old = Path('existing')
              manifest = json.load(open('preflight/manifest.json'))
              previous = json.load(open(old / 'manifest.json'))
              for name, entry in manifest['packages'].items():
                  current = previous['packages'].get(name, {}).get('current')
                  if current and current['version'] == entry['current']['version'] and current['assets'] != entry['current']['assets']:
                      raise SystemExit('Same version has different assets: ' + name)
              for path in Path('preflight').iterdir():
                  if path.suffix in ('.ipk', '.apk') and (old / path.name).exists():
                      if path.read_bytes() != (old / path.name).read_bytes():
                          raise SystemExit('Existing asset has different bytes: ' + path.name)
          PY
      - name: Install signing verifier (no compilation)
        run: |
          sudo apt-get update
          sudo apt-get install -y usign
      - name: Sign and publish verified packages
        env:
          USIGN: /usr/bin/usign
          USIGN_SECRET_KEY: ${{ secrets.USIGN_SECRET_KEY }}
        run: scripts/publish.sh publisher packages
